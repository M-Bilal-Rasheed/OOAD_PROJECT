# ============================================================
# Sports Player Valuation & Scouting System - Configuration
# ============================================================

# --- Supabase PostgreSQL connection ---
# Set these three environment variables before running.
# See run.ps1 for instructions. Do NOT hardcode credentials here.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection pool — fail fast if credentials are wrong (10 second timeout)
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.initialization-fail-timeout=10000

# --- JPA / Hibernate ---
# 'update' creates tables on first run and adds new columns automatically.
# Safe for development. Does NOT drop existing data.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=false

# --- Application name ---
spring.application.name=Sports Player Valuation and Scouting System

# --- Debug logging ---
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.com.fsms=DEBUG

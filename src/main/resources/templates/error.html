<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Error - SPVSS</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .error-container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 600px;
            width: 100%;
            padding: 60px 40px;
            text-align: center;
        }
        .error-code {
            font-size: 120px;
            font-weight: 900;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin: 0;
            line-height: 1;
        }
        .error-message {
            font-size: 32px;
            color: #2c3e50;
            margin: 20px 0 10px 0;
            font-weight: 600;
        }
        .error-description {
            font-size: 16px;
            color: #7f8c8d;
            margin-bottom: 30px;
            line-height: 1.6;
        }
        .error-details {
            background: #ecf0f1;
            border-left: 4px solid #e74c3c;
            padding: 20px;
            margin: 30px 0;
            text-align: left;
            border-radius: 4px;
            font-family: 'Monaco', 'Courier New', monospace;
            font-size: 12px;
            color: #2c3e50;
            overflow-x: auto;
        }
        .detail-row {
            margin: 10px 0;
        }
        .detail-label {
            font-weight: bold;
            color: #e74c3c;
        }
        .action-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 40px;
        }
        .btn {
            padding: 12px 30px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }
        .btn-secondary {
            background: #ecf0f1;
            color: #2c3e50;
            border: 2px solid #bdc3c7;
        }
        .btn-secondary:hover {
            background: #bdc3c7;
            color: white;
        }
    </style>
</head>
<body>
<div class="error-container">
    <h1 class="error-code" th:text="${status}">500</h1>
    <h2 class="error-message" th:text="${error}">Internal Server Error</h2>
    <p class="error-description">
        Something went wrong while processing your request. The error has been logged and our team has been notified.
    </p>
    
    <div class="error-details">
        <div class="detail-row" th:if="${path}">
            <span class="detail-label">Path:</span>
            <span th:text="${path}">Unknown path</span>
        </div>
        <div class="detail-row" th:if="${message}">
            <span class="detail-label">Message:</span>
            <span th:text="${message}">No message available</span>
        </div>
        <div class="detail-row" th:if="${status}">
            <span class="detail-label">Status:</span>
            <span th:text="${status}">Unknown status</span>
        </div>
    </div>
    
    <div class="action-buttons">
        <a href="/" class="btn btn-primary">Return to Home</a>
        <a href="javascript:history.back()" class="btn btn-secondary">Go Back</a>
    </div>
</div>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<!--
  Shared layout fragments used by every page:
    head(title)      — meta tags, fonts, stylesheet, theme bootstrap script
    topbar(active)   — role-aware navigation with dark/light toggle
    alerts           — flash messages (success / error / info)
    themeToggle      — the dark/light mode button on its own (auth pages)
-->
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' · SPVSS'">SPVSS</title>
    <!-- Apply the saved theme before the page paints (no light flash in dark mode) -->
    <script>
        (function () {
            var theme = null;
            try { theme = localStorage.getItem('spvss-theme'); } catch (e) {}
            if (theme !== 'light' && theme !== 'dark') {
                theme = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
            }
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230b7a53'/%3E%3Ctext x='16' y='21' font-family='Arial' font-size='13' font-weight='700' fill='white' text-anchor='middle'%3ESP%3C/text%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <script th:src="@{/js/app.js}" defer></script>
</head>
<body>

<button th:fragment="themeToggle" type="button" class="theme-toggle" data-theme-toggle
        aria-label="Toggle dark mode" title="Toggle dark mode">
    <svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>
    </svg>
    <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="4"/>
        <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
    </svg>
</button>

<header th:fragment="topbar(active)" class="topbar">
    <div class="topbar-inner">
        <a class="brand" th:href="${currentRole == 'ADMIN'} ? @{/admin/dashboard} : @{/scout/dashboard}">
            <span class="brand-mark" aria-hidden="true">SP</span>
            <span class="brand-text">SPVSS<small>Valuation &amp; Scouting</small></span>
        </a>

        <button type="button" class="nav-toggle" data-nav-toggle aria-expanded="false" aria-controls="primary-nav">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
            <span>Menu</span>
        </button>

        <nav id="primary-nav" class="primary-nav" aria-label="Main">
            <th:block th:if="${currentRole == 'ADMIN'}">
                <a th:href="@{/admin/dashboard}"   th:classappend="${active == 'admin-dashboard'} ? 'active'">Dashboard</a>
                <a th:href="@{/admin/players}"     th:classappend="${active == 'admin-players'} ? 'active'">Manage Players</a>
                <a th:href="@{/admin/players/new}" th:classappend="${active == 'admin-new'} ? 'active'">Add Player</a>
                <a th:href="@{/scout/players}"     th:classappend="${active == 'players'} ? 'active'">Browse</a>
                <a th:href="@{/scout/analytics}"   th:classappend="${active == 'analytics'} ? 'active'">Analytics</a>
                <a th:href="@{/scout/reports}"     th:classappend="${active == 'reports'} ? 'active'">Reports</a>
            </th:block>
            <th:block th:unless="${currentRole == 'ADMIN'}">
                <a th:href="@{/scout/dashboard}"   th:classappend="${active == 'dashboard'} ? 'active'">Dashboard</a>
                <a th:href="@{/scout/players}"     th:classappend="${active == 'players'} ? 'active'">Players</a>
                <a th:href="@{/scout/analytics}"   th:classappend="${active == 'analytics'} ? 'active'">Analytics</a>
                <a th:href="@{/scout/compare}"     th:classappend="${active == 'compare'} ? 'active'">Compare</a>
                <a th:href="@{/scout/reports}"     th:classappend="${active == 'reports'} ? 'active'">Reports</a>
                <a th:href="@{/scout/comparisons}" th:classappend="${active == 'history'} ? 'active'">History</a>
                <a th:href="@{/scout/shortlist}"   th:classappend="${active == 'shortlist'} ? 'active'">Shortlist</a>
            </th:block>
        </nav>

        <div class="topbar-actions">
            <button th:replace="~{fragments/layout :: themeToggle}"></button>
            <span class="user-chip" th:if="${currentUserName != ''}">
                <span class="user-avatar" aria-hidden="true" th:text="${#strings.substring(currentUserName, 0, 1)}">A</span>
                <span class="user-name" th:text="${currentUserName}">User</span>
                <span class="user-role" th:text="${currentRole == 'ADMIN'} ? 'Admin' : 'Scout'">Scout</span>
            </span>
            <a th:href="@{/logout}" class="btn btn-outline btn-sm">Log out</a>
        </div>
    </div>
</header>

<div th:fragment="alerts" class="alerts">
    <div th:if="${successMessage}"   class="alert alert-success" role="status" th:text="${successMessage}"></div>
    <div th:if="${errorMessage}"     class="alert alert-error"   role="alert"  th:text="${errorMessage}"></div>
    <div th:if="${valuationMessage}" class="alert alert-info"    role="status" th:text="${valuationMessage}"></div>
</div>

</body>
</html>

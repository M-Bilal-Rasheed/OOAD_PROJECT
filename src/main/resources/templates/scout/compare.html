<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/layout :: head('Compare players')}"></head>
<body>

<header th:replace="~{fragments/layout :: topbar('compare')}"></header>

<main class="page page-narrow">
    <div class="page-header">
        <div>
            <h1>Compare two players</h1>
            <p>Head-to-head comparison for two players of the <strong>same sport</strong>. Each statistic follows its
               own rule, so a lower economy rate (Cricket) or a lower ranking (Tennis) counts as better.</p>
        </div>
    </div>

    <div th:replace="~{fragments/layout :: alerts}"></div>

    <form th:action="@{/scout/compare/result}" method="get" class="card">
        <div class="form-grid">
            <div class="form-group">
                <label for="player1Id">Player 1</label>
                <select id="player1Id" name="player1Id" required>
                    <option value="">Select the first player</option>
                    <optgroup th:each="sp : ${sports}" th:label="${sp}">
                        <option th:each="p : ${players}" th:if="${p.sport == sp}"
                                th:value="${p.id}" th:attr="data-sport=${p.sport}"
                                th:selected="${selected1 != null and selected1 == p.id}"
                                th:text="${p.name} + ' — ' + ${p.position}"></option>
                    </optgroup>
                </select>
            </div>

            <div class="form-group">
                <label for="player2Id">Player 2 (same sport)</label>
                <select id="player2Id" name="player2Id" required>
                    <option value="">Select the second player</option>
                    <optgroup th:each="sp : ${sports}" th:label="${sp}">
                        <option th:each="p : ${players}" th:if="${p.sport == sp}"
                                th:value="${p.id}" th:attr="data-sport=${p.sport}"
                                th:text="${p.name} + ' — ' + ${p.position}"></option>
                    </optgroup>
                </select>
                <div class="form-hint" id="compare-hint" aria-live="polite"></div>
            </div>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-primary btn-lg">Compare players</button>
            <a th:href="@{/scout/comparisons}" class="btn btn-outline btn-lg">Saved comparisons</a>
        </div>
    </form>
</main>

</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Player Search — Scout — SPVSS</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<nav>
    <a class="brand" th:href="@{/scout/dashboard}">🏅 SPVSS — Scout</a>
    <div>
        <a th:href="@{/scout/players}">Players</a>
        <a th:href="@{/scout/compare}">Compare</a>
        <a th:href="@{/scout/shortlist}">My Shortlist</a>
        <a th:href="@{/logout}">Logout</a>
    </div>
</nav>

<div class="container">
    <h1>Player Search</h1>

    <!-- Search and filter form -->
    <form th:action="@{/scout/players}" method="get" class="search-form">
        <div class="form-group">
            <label>Name</label>
            <input type="text" name="name" th:value="${searchName}" placeholder="Search by name...">
        </div>
        <div class="form-group">
            <label>Sport</label>
            <select name="sport">
                <option value="" th:selected="${searchSport == ''}">All Sports</option>
                <option value="Football"   th:selected="${searchSport == 'Football'}">⚽ Football</option>
                <option value="Cricket"    th:selected="${searchSport == 'Cricket'}">🏏 Cricket</option>
                <option value="Basketball" th:selected="${searchSport == 'Basketball'}">🏀 Basketball</option>
                <option value="Tennis"     th:selected="${searchSport == 'Tennis'}">🎾 Tennis</option>
            </select>
        </div>
        <div class="form-group">
            <label>Position / Role</label>
            <input type="text" name="position" th:value="${searchPosition}" placeholder="e.g. Striker, Batsman...">
        </div>
        <div class="form-group">
            <label>Team / Club</label>
            <input type="text" name="club" th:value="${searchClub}" placeholder="Search by team...">
        </div>
        <div>
            <button type="submit" class="btn btn-primary">Search</button>
            <a th:href="@{/scout/players}" class="btn btn-secondary">Clear</a>
        </div>
    </form>

    <div th:if="${noResults}" class="alert alert-info">
        No players match your search criteria. Try different filters.
    </div>

    <table th:unless="${noResults}">
        <thead>
            <tr>
                <th>Name</th>
                <th>Sport</th>
                <th>Age</th>
                <th>Position</th>
                <th>Team / Club</th>
                <th>Est. Value</th>
                <th>View</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="player : ${players}">
                <td th:text="${player.name}"></td>
                <td th:text="${player.sport}"></td>
                <td th:text="${player.age}"></td>
                <td th:text="${player.position}"></td>
                <td th:text="${player.club}"></td>
                <td>
                    <span th:if="${player.estimatedValue != null}"
                          th:text="'£' + ${#numbers.formatInteger(player.estimatedValue, 1, 'COMMA')}"></span>
                    <span th:unless="${player.estimatedValue != null}" style="color:#999;">Not calculated</span>
                </td>
                <td>
                    <a th:href="@{/scout/players/{id}(id=${player.id})}" class="btn btn-primary">View</a>
                </td>
            </tr>
        </tbody>
    </table>
</div>

</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/layout :: head('Player search')}"></head>
<body>

<header th:replace="~{fragments/layout :: topbar('players')}"></header>

<main class="page">
    <div class="page-header">
        <div>
            <h1>Player search</h1>
            <p>Filter the player database by name, sport, position or team.</p>
        </div>
    </div>

    <form th:action="@{/scout/players}" method="get" class="card search-panel" role="search">
        <div class="form-group">
            <label for="f-name">Name</label>
            <input type="search" id="f-name" name="name" th:value="${searchName}" placeholder="Search by name">
        </div>
        <div class="form-group">
            <label for="f-sport">Sport</label>
            <select id="f-sport" name="sport">
                <option value=""           th:selected="${searchSport == ''}">All sports</option>
                <option value="Football"   th:selected="${searchSport == 'Football'}">Football</option>
                <option value="Cricket"    th:selected="${searchSport == 'Cricket'}">Cricket</option>
                <option value="Basketball" th:selected="${searchSport == 'Basketball'}">Basketball</option>
                <option value="Tennis"     th:selected="${searchSport == 'Tennis'}">Tennis</option>
            </select>
        </div>
        <div class="form-group">
            <label for="f-position">Position / role</label>
            <input type="text" id="f-position" name="position" th:value="${searchPosition}" placeholder="e.g. Striker">
        </div>
        <div class="form-group">
            <label for="f-club">Team / club</label>
            <input type="text" id="f-club" name="club" th:value="${searchClub}" placeholder="Search by team">
        </div>
        <div class="btn-group">
            <button type="submit" class="btn btn-primary">Search</button>
            <a th:href="@{/scout/players}" class="btn btn-outline">Clear</a>
        </div>
    </form>

    <div th:if="${noResults}" class="empty">
        <h3>No players match these filters</h3>
        <p>Try a different name, sport or team.</p>
        <a th:href="@{/scout/players}" class="btn btn-outline">Clear filters</a>
    </div>

    <div class="table-wrap" th:unless="${noResults}">
        <table>
            <thead>
            <tr>
                <th>Name</th>
                <th>Sport</th>
                <th>Age</th>
                <th>Position</th>
                <th>Team / Club</th>
                <th>Est. value</th>
                <th class="actions"><span class="visually-hidden">Actions</span></th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="player : ${players}">
                <td><a class="cell-link" th:href="@{/scout/players/{id}(id=${player.id})}" th:text="${player.name}"></a></td>
                <td><span class="badge badge-sport" th:classappend="'badge-' + ${#strings.toLowerCase(player.sport)}"
                          th:text="${player.sport}"></span></td>
                <td class="num" th:text="${player.age}"></td>
                <td th:text="${player.position}"></td>
                <td th:text="${player.club}"></td>
                <td class="num">
                    <span th:if="${player.estimatedValue != null}"
                          th:text="'£' + ${#numbers.formatInteger(player.estimatedValue, 1, 'COMMA')}"></span>
                    <span th:unless="${player.estimatedValue != null}" class="muted">Not calculated</span>
                </td>
                <td class="actions">
                    <a th:href="@{/scout/players/{id}(id=${player.id})}" class="btn btn-outline btn-sm">View profile</a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</main>

</body>
</html>

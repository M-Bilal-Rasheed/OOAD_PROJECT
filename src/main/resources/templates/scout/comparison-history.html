<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/layout :: head('Comparison history')}"></head>
<body>

<header th:replace="~{fragments/layout :: topbar('history')}"></header>

<main class="page">
    <div class="page-header">
        <div>
            <h1>Comparison history</h1>
            <p>Reopen or remove the comparisons you have saved.</p>
        </div>
        <div class="actions">
            <a th:href="@{/scout/compare}" class="btn btn-primary">New comparison</a>
        </div>
    </div>

    <div th:replace="~{fragments/layout :: alerts}"></div>

    <div th:if="${#lists.isEmpty(comparisons)}" class="empty">
        <h3>No saved comparisons yet</h3>
        <p>Compare two players of the same sport and save the result to find it here.</p>
        <a th:href="@{/scout/compare}" class="btn btn-primary">Compare players</a>
    </div>

    <div class="table-wrap" th:unless="${#lists.isEmpty(comparisons)}">
        <table>
            <thead>
            <tr>
                <th>Title</th>
                <th>Saved</th>
                <th>Players</th>
                <th class="actions"><span class="visually-hidden">Actions</span></th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="c : ${comparisons}">
                <td>
                    <a class="cell-link" th:href="@{/scout/comparisons/{id}(id=${c.id})}"
                       th:text="${c.title} ?: 'Comparison ' + ${c.id}">Comparison</a>
                </td>
                <td class="num" th:text="${#temporals.format(c.createdAt, 'd MMM yyyy, HH:mm')}">date</td>
                <td><span th:text="${#lists.size(c.comparisonPlayers)}">2</span> players</td>
                <td class="actions">
                    <a th:href="@{/scout/comparisons/{id}(id=${c.id})}" class="btn btn-outline btn-sm">Open</a>
                    <form th:action="@{/scout/comparisons/{id}/delete(id=${c.id})}" method="post" class="inline-form"
                          data-confirm="Delete this saved comparison?">
                        <button type="submit" class="btn btn-danger btn-sm">Delete</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</main>

</body>
</html>

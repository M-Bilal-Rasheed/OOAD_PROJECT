<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>All Players — Admin — SPVSS</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<nav>
    <a class="brand" th:href="@{/admin/dashboard}">🏅 SPVSS — Admin</a>
    <div>
        <a th:href="@{/admin/players}">All Players</a>
        <a th:href="@{/admin/players/new}">Add Player</a>
        <a th:href="@{/logout}">Logout</a>
    </div>
</nav>

<div class="container">
    <h1>All Players</h1>

    <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>

    <a th:href="@{/admin/players/new}" class="btn btn-success">+ Add New Player</a>
    <br><br>

    <div th:if="${#lists.isEmpty(players)}" class="alert alert-info">
        No players found. Add the first player using the button above.
    </div>

    <table th:unless="${#lists.isEmpty(players)}">
        <thead>
            <tr>
                <th>Name</th>
                <th>Sport</th>
                <th>Age</th>
                <th>Position</th>
                <th>Team / Club</th>
                <th>Nationality</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="player : ${players}">
                <td th:text="${player.name}"></td>
                <td th:text="${player.sport}"></td>
                <td th:text="${player.age}"></td>
                <td th:text="${player.position}"></td>
                <td th:text="${player.club}"></td>
                <td th:text="${player.nationality}"></td>
                <td>
                    <a th:href="@{/admin/players/edit/{id}(id=${player.id})}" class="btn btn-primary">Edit</a>
                    <form th:action="@{/admin/players/delete/{id}(id=${player.id})}"
                          method="post" style="display:inline;"
                          onsubmit="return confirm('Delete this player?');">
                        <button type="submit" class="btn btn-danger">Delete</button>
                    </form>
                </td>
            </tr>
        </tbody>
    </table>
</div>

</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/layout :: head('Manage players')}"></head>
<body>

<header th:replace="~{fragments/layout :: topbar('admin-players')}"></header>

<main class="page">
    <div class="page-header">
        <div>
            <div class="eyebrow">Admin</div>
            <h1>Manage players</h1>
            <p><span th:text="${#lists.size(players)}">0</span> player profiles in the database.</p>
        </div>
        <div class="actions">
            <a th:href="@{/admin/players/new}" class="btn btn-primary">Add player</a>
        </div>
    </div>

    <div th:replace="~{fragments/layout :: alerts}"></div>

    <div th:if="${#lists.isEmpty(players)}" class="empty">
        <h3>No players yet</h3>
        <p>Add the first player profile to get started.</p>
        <a th:href="@{/admin/players/new}" class="btn btn-primary">Add player</a>
    </div>

    <div class="table-wrap" th:unless="${#lists.isEmpty(players)}">
        <table>
            <thead>
            <tr>
                <th>Name</th>
                <th>Sport</th>
                <th>Age</th>
                <th>Position</th>
                <th>Team / Club</th>
                <th>Nationality</th>
                <th class="actions">Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="player : ${players}">
                <td class="cell-strong" th:text="${player.name}"></td>
                <td><span class="badge badge-sport" th:classappend="'badge-' + ${#strings.toLowerCase(player.sport)}"
                          th:text="${player.sport}"></span></td>
                <td class="num" th:text="${player.age}"></td>
                <td th:text="${player.position}"></td>
                <td th:text="${player.club}"></td>
                <td th:text="${player.nationality}"></td>
                <td class="actions">
                    <a th:href="@{/admin/players/edit/{id}(id=${player.id})}" class="btn btn-outline btn-sm">Edit</a>
                    <form th:action="@{/admin/players/delete/{id}(id=${player.id})}" method="post" class="inline-form"
                          th:attr="data-confirm='Delete ' + ${player.name} + '? Their scouting reports are deleted too.'">
                        <button type="submit" class="btn btn-danger btn-sm">Delete</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</main>

</body>
</html>

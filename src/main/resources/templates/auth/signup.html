<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Create Account — SPVSS</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="auth-page">

<div class="auth-container">

    <div class="auth-brand">
        <span>🏅</span>
        <h1>Sports Player Valuation &amp; Scouting</h1>
        <p>Create your Scout account</p>
    </div>

    <div th:if="${errorMessage}" class="alert alert-error" th:text="${errorMessage}"></div>

    <div class="auth-card">

        <div class="alert alert-info" style="margin-bottom:16px; font-size:0.875rem;">
            Public registration creates a <strong>Scout</strong> account.
            Admin accounts are provisioned separately by a system administrator.
        </div>

        <form th:action="@{/signup}" method="post">

            <div class="form-group">
                <label for="fullName">Full Name</label>
                <input type="text" id="fullName" name="fullName"
                       th:value="${enteredName}"
                       placeholder="Your full name" required autofocus>
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email"
                       th:value="${enteredEmail}"
                       placeholder="you@example.com" required>
            </div>

            <div class="form-group">
                <label for="password">Password <small style="color:#999;">(min. 6 characters)</small></label>
                <input type="password" id="password" name="password"
                       placeholder="Choose a password" required minlength="6">
            </div>

            <div class="form-group">
                <label for="confirmPassword">Confirm Password</label>
                <input type="password" id="confirmPassword" name="confirmPassword"
                       placeholder="Repeat your password" required minlength="6">
            </div>

            <button type="submit" class="btn btn-success btn-full">Create Account</button>
        </form>

        <p class="auth-link">
            Already have an account?
            <a th:href="@{/login}">Sign in</a>
        </p>
    </div>

</div>

</body>
</html>

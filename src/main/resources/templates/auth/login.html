<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/layout :: head('Sign in')}"></head>
<body class="auth-page">

<div class="auth-corner">
    <button th:replace="~{fragments/layout :: themeToggle}"></button>
</div>

<main class="auth-container">

    <div class="auth-brand">
        <div class="brand-mark" aria-hidden="true">SP</div>
        <h1>Sports Player Valuation &amp; Scouting</h1>
        <p>Sign in to your Admin or Scout account</p>
    </div>

    <div th:if="${successMessage}" class="alert alert-success" role="status" th:text="${successMessage}"></div>
    <div th:if="${logoutMessage}"  class="alert alert-info"    role="status" th:text="${logoutMessage}"></div>
    <div th:if="${errorMessage}"   class="alert alert-error"   role="alert"  th:text="${errorMessage}"></div>

    <div class="auth-card">
        <form th:action="@{/login}" method="post">
            <div class="form-group">
                <label for="email">Email address</label>
                <input type="email" id="email" name="email" autocomplete="email"
                       th:value="${enteredEmail}" placeholder="you@example.com" required autofocus>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" autocomplete="current-password"
                       placeholder="Your password" required>
            </div>

            <button type="submit" class="btn btn-primary btn-full btn-lg">Sign in</button>
        </form>

        <p class="auth-link">
            New here? <a th:href="@{/signup}">Create a Scout account</a>
        </p>
    </div>
</main>

</body>
</html>
